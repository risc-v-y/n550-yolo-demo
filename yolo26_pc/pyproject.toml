[project]
name = "yolo26-pc-reference"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "pyserial==3.5",
    "ultralytics==8.4.143",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
